name: iOS build check

# Builds the iPhone and iPad app on one of GitHub's Macs, so the iOS project is known to
# compile and launch without anyone needing a Mac. It does not sign or upload anything.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy the game into the iOS project
        run: npx cap sync ios

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | xcbeautify

      - name: Launch on an iPhone and an iPad, and take a picture of each
        run: |
          mkdir -p screenshots
          shoot() {
            local name="$1" file="$2"
            local udid
            udid=$(xcrun simctl list devices available | grep -m1 "$name (" | grep -oE '[0-9A-F-]{36}')
            if [ -z "$udid" ]; then echo "No simulator named $name on this Mac; skipping."; return 0; fi
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/App.app
            xcrun simctl launch "$udid" com.michcakee.vietbakeshop
            sleep 15
            xcrun simctl io "$udid" screenshot "screenshots/$file.png"
            xcrun simctl shutdown "$udid"
          }
          shoot "iPhone 16 Pro Max" iphone-title
          shoot "iPad Pro 13-inch (M4)" ipad-title
          ls -la screenshots

      - name: Build for real devices (release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | xcbeautify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots
          if-no-files-found: warn
