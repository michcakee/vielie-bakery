<!DOCTYPE html>
<html>
<head>
  <title>Pokemon Clicker</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #f0f4ff;
    }

    #catchButton {
      font-size: 80px;
      background-color: #e3350d;
      color: white;
      border: 5px solid black;
      border-radius: 50%;
      width: 180px;
      height: 180px;
      cursor: pointer;
    }

    .shopButton {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      cursor: pointer;
    }

    #achievement {
      color: gold;
      font-size: 24px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Pokemon Clicker</h1>

  <h2>Pokemon caught: <span id="pokemonCount">0</span></h2>

  <button id="catchButton">O</button>

  <p>Per click: <span id="perClick">1</span> | Per second: <span id="perSecond">0</span></p>

  <button id="greatBallButton" class="shopButton">Buy Great Ball (+1 per click) - Cost: <span id="greatBallCost">10</span></button>
  <br>
  <button id="trainerButton" class="shopButton">Hire Trainer (+1 per second) - Cost: <span id="trainerCost">25</span></button>

  <p id="achievement">ACHIEVEMENT UNLOCKED: Pokemon Master! (100 caught)</p>

  <script>
    // ---------- variables ----------
    var pokemon = 0;
    var perClick = 1;
    var perSecond = 0;
    var greatBallCost = 10;
    var trainerCost = 25;

    // ---------- clicking the pokeball ----------
    function catchPokemon() {
      pokemon = pokemon + perClick;
      updateScreen();
    }

    document.getElementById("catchButton").addEventListener("click", catchPokemon);

    // ---------- upgrade: more per click ----------
    function buyGreatBall() {
      if (pokemon >= greatBallCost) {
        pokemon = pokemon - greatBallCost;
        perClick = perClick + 1;
        greatBallCost = greatBallCost * 2;
      }
      updateScreen();
    }

    document.getElementById("greatBallButton").addEventListener("click", buyGreatBall);

    // ---------- upgrade: automatic catching ----------
    function hireTrainer() {
      if (pokemon >= trainerCost) {
        pokemon = pokemon - trainerCost;
        perSecond = perSecond + 1;
        trainerCost = trainerCost * 2;
      }
      updateScreen();
    }

    document.getElementById("trainerButton").addEventListener("click", hireTrainer);

    // this runs every 1000 milliseconds (1 second)
    function autoCatch() {
      pokemon = pokemon + perSecond;
      updateScreen();
    }

    setInterval(autoCatch, 1000);

    // ---------- updating the page ----------
    function updateScreen() {
      document.getElementById("pokemonCount").textContent = pokemon;
      document.getElementById("perClick").textContent = perClick;
      document.getElementById("perSecond").textContent = perSecond;
      document.getElementById("greatBallCost").textContent = greatBallCost;
      document.getElementById("trainerCost").textContent = trainerCost;

      // achievement: show the hidden text once you reach 100
      if (pokemon >= 100) {
        document.getElementById("achievement").style.display = "block";
      }
    }
  </script>

</body>
</html>
