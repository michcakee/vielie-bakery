<!DOCTYPE html>
<html>
<head>
  <title>Pokemon Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffcb05;
      text-align: center;
      margin: 0;
    }

    h1 {
      color: #2a75bb;
      text-shadow: 2px 2px #ffffff;
      font-size: 40px;
      margin-top: 30px;
    }

    .game {
      background-color: white;
      width: 400px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    #pikachu {
      width: 200px;
      cursor: pointer;
      image-rendering: pixelated;
    }

    #pikachu:hover {
      transform: scale(1.1);
    }

    #pikachu:active {
      transform: scale(0.9);
    }

    .shop {
      background-color: #e3350d;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      margin: 8px;
      cursor: pointer;
    }

    .shop:hover {
      background-color: #b02a0a;
    }
  </style>
</head>
<body>

  <h1>Pokemon Clicker</h1>

  <div class="game">
    <h2>Pokemon caught: <span id="count">0</span></h2>

    <img id="pikachu" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png">

    <p>Per click: <span id="perClick">1</span> &nbsp; | &nbsp; Per second: <span id="perSecond">0</span></p>

    <button id="greatBall" class="shop">Great Ball (+1 per click) - <span id="greatBallCost">10</span></button>
    <br>
    <button id="trainer" class="shop">Hire Trainer (+1 per second) - <span id="trainerCost">25</span></button>
  </div>

  <script>
    var pokemon = 0;
    var perClick = 1;
    var perSecond = 0;
    var greatBallCost = 10;
    var trainerCost = 25;

    // clicking pikachu
    document.getElementById("pikachu").addEventListener("click", function() {
      pokemon = pokemon + perClick;
      update();
    });

    // great ball = more per click
    document.getElementById("greatBall").addEventListener("click", function() {
      if (pokemon >= greatBallCost) {
        pokemon = pokemon - greatBallCost;
        perClick = perClick + 1;
        greatBallCost = greatBallCost * 2;
        update();
      }
    });

    // trainer = catches pokemon for you
    document.getElementById("trainer").addEventListener("click", function() {
      if (pokemon >= trainerCost) {
        pokemon = pokemon - trainerCost;
        perSecond = perSecond + 1;
        trainerCost = trainerCost * 2;
        update();
      }
    });

    // runs once every second
    setInterval(function() {
      pokemon = pokemon + perSecond;
      update();
    }, 1000);

    function update() {
      document.getElementById("count").textContent = pokemon;
      document.getElementById("perClick").textContent = perClick;
      document.getElementById("perSecond").textContent = perSecond;
      document.getElementById("greatBallCost").textContent = greatBallCost;
      document.getElementById("trainerCost").textContent = trainerCost;
    }
  </script>

</body>
</html>
