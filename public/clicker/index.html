<!DOCTYPE html>
<html>
<head>
  <title>Pokemon Clicker</title>
  <style>
    body {
      font-family: Arial;
      background-color: #ffcb05;
      text-align: center;
    }

    h1 {
      color: #2a75bb;
    }

    #pikachu {
      width: 200px;
      cursor: pointer;
    }

    #pikachu:active {
      transform: scale(1.15);
    }

    button {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #2a75bb;
      background-color: white;
      font-size: 14px;
      margin: 10px;
      cursor: pointer;
    }

    #badge {
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Pokemon Clicker</h1>

  <p>Pokemon caught: <span id="count">0</span></p>

  <img id="pikachu" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png">

  <p>Per click: <span id="perClick">1</span> | Per second: <span id="perSecond">0</span></p>

  <button id="greatBall">Great Ball<br>+1 per click<br>Cost: <span id="greatBallCost">10</span></button>
  <button id="trainer">Hire Trainer<br>+1 per second<br>Cost: <span id="trainerCost">25</span></button>

  <p id="badge">Badge earned: Pokemon Master (100 caught)</p>

  <p id="lucky"></p>

  <script>
    var pokemon = 0;
    var perClick = 1;
    var perSecond = 0;
    var greatBallCost = 10;
    var trainerCost = 25;

    document.getElementById("pikachu").addEventListener("click", function() {
      pokemon = pokemon + perClick;
      update();
    });

    document.getElementById("greatBall").addEventListener("click", function() {
      if (pokemon >= greatBallCost) {
        pokemon = pokemon - greatBallCost;
        perClick = perClick + 1;
        greatBallCost = greatBallCost * 2;
        update();
      }
    });

    document.getElementById("trainer").addEventListener("click", function() {
      if (pokemon >= trainerCost) {
        pokemon = pokemon - trainerCost;
        perSecond = perSecond + 1;
        trainerCost = trainerCost * 2;
        update();
      }
    });

    setInterval(function() {
      pokemon = pokemon + perSecond;
      update();
    }, 1000);

    setInterval(function() {
      if (Math.random() < 0.5) {
        pokemon = pokemon + 20;
        document.getElementById("lucky").textContent = "A wild Pokemon wandered by! +20";
      } else {
        document.getElementById("lucky").textContent = "Nothing in the tall grass this time...";
      }
      update();
    }, 30000);

    function update() {
      document.getElementById("count").textContent = pokemon;
      document.getElementById("perClick").textContent = perClick;
      document.getElementById("perSecond").textContent = perSecond;
      document.getElementById("greatBallCost").textContent = greatBallCost;
      document.getElementById("trainerCost").textContent = trainerCost;

      if (pokemon >= 100) {
        document.getElementById("badge").style.display = "block";
      }
    }
  </script>

</body>
</html>
